[package]
name = "bubbaloop"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Bubbaloop - Physical AI camera streaming platform"

[[bin]]
name = "bubbaloop"
path = "src/bin/bubbaloop.rs"

[[bin]]
name = "bubbaloop-dash"
path = "src/bin/bubbaloop_dash.rs"
required-features = ["dashboard"]

[dependencies]
# Protobuf
prost.workspace = true
prost-types.workspace = true
prost-reflect.workspace = true

# Serialization
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
ciborium.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# CLI
argh.workspace = true
log.workspace = true
env_logger.workspace = true
walkdir = "2"
rpassword.workspace = true
open.workspace = true

# Zenoh for daemon communication
zenoh.workspace = true

# Async runtime
tokio.workspace = true

# Directories
dirs.workspace = true

# Misc
whoami = "1"
hostname = "0.4"
sysinfo.workspace = true
hex.workspace = true

# D-Bus for systemd communication (daemon)
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Async (daemon)
futures.workspace = true

# Signal handling (daemon)
ctrlc.workspace = true

# UUID generation (daemon)
uuid = { version = "1", features = ["v4"] }

# HTTP server (used by MCP + dashboard)
axum.workspace = true

# Dashboard server (optional)
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

# Agent layer (Claude API + memory + scheduler)
reqwest.workspace = true
rusqlite.workspace = true
cron.workspace = true
chrono.workspace = true

# Agent v2: Soul hot-reload + TOML config
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
toml = "0.8"

# Camera vision: base64 for encoding grab_frame JPEG responses
base64 = "0.22"

# Storage: integrity hashing + secret zeroization + async backend trait
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
async-trait = "0.1"
# Storage: S3-compatible backend (R2/AWS/GCS/MinIO), behind the optional `s3`
# feature so default builds stay lean. Routed through rustls+ring (no aws-lc /
# cmake); behavior-version is set explicitly in code.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "rt-tokio",
    "behavior-version-latest",
], optional = true }
aws-smithy-http-client = { version = "1", default-features = false, features = [
    "rustls-ring",
], optional = true }
aws-smithy-types = { version = "1", optional = true }
aws-smithy-runtime-api = { version = "1", optional = true }

# TUI for agent chat REPL
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# MCP server (core)
rmcp.workspace = true
schemars.workspace = true
tower_governor = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", default-features = true }

[features]
default = []
dashboard = ["dep:rust-embed", "dep:mime_guess", "dep:tokio-tungstenite", "axum/ws"]
# S3-compatible storage backend (R2/AWS/GCS/MinIO). Optional because aws-sdk-s3
# is a large dependency tree; enable for cloud uploads.
s3 = [
    "dep:aws-sdk-s3",
    "dep:aws-smithy-http-client",
    "dep:aws-smithy-types",
    "dep:aws-smithy-runtime-api",
]
test-harness = ["rmcp/client"]

[dev-dependencies]
tempfile = "3"
rmcp = { workspace = true, features = ["client", "server", "macros"] }

[build-dependencies]
prost-build.workspace = true
